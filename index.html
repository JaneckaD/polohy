<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IDZK live" />
    <title>IDZK live</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <main class="app">
      <!-- Mapa -->
      <section id="view-map" class="view active" aria-label="Mapa">
        <div id="map"></div>

        <header class="topbar">
          <div class="brand glass">
            <svg class="brand-logo" width="32" height="32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 246"><defs><clipPath id="idzk-hatch"><polygon points="173,42 208,42 208,71 71,208 39,208 39,176"/></clipPath></defs><circle cx="123" cy="123" r="123" fill="#0e2d6a"/><g transform="translate(123 123) scale(0.66) translate(-123.5 -125.0)"><g fill="#fff"><rect x="39" y="42" width="169" height="38"/><rect x="39" y="168" width="169" height="40"/><polygon points="173,42 208,42 208,71 71,208 39,208 39,176"/></g><path clip-path="url(#idzk-hatch)" d="M157.00 30L347.00 220M120.75 30L310.75 220M84.50 30L274.50 220M48.25 30L238.25 220M12.00 30L202.00 220M-24.25 30L165.75 220M-60.50 30L129.50 220M-96.75 30L93.25 220" stroke="#0e2d6a" stroke-width="12.73"/></g></svg>
            <div>
              <div class="brand-name">IDZK live</div>
              <div id="status" class="brand-status" role="status">Načítám…</div>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="reload" class="round-btn glass" type="button" title="Obnovit" aria-label="Obnovit aplikaci a polohy vozů">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
            </button>
            <button id="filter-open" class="round-btn glass" type="button" aria-label="Filtr vozidel a vlaků">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
              <span id="filter-badge" class="badge" hidden></span>
            </button>
          </div>
        </header>

        <div id="active-filter" class="active-filter glass" hidden></div>
        <div id="journey-bar" class="active-filter glass" hidden></div>

        <div class="fab-stack">
          <button id="locate" class="round-btn glass tinted" type="button" title="Moje poloha" aria-label="Moje poloha">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20.9 3.1a.8.8 0 0 0-.86-.17L3.5 9.6a.8.8 0 0 0 .06 1.5l6.9 2.4 2.4 6.9a.8.8 0 0 0 1.5.06l6.66-16.5a.8.8 0 0 0-.17-.86z"/></svg>
          </button>
        </div>

        <div id="hover-card" class="hover-card glass" hidden></div>

        <div id="sheet" class="sheet glass" hidden>
          <div class="sheet-handle" aria-hidden="true"><div class="sheet-grip"></div></div>
          <button class="sheet-close icon-btn" type="button" aria-label="Zavřít">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div class="sheet-details"></div>
          <div class="sheet-trip"></div>
        </div>
      </section>

      <!-- Vyhledávání spojení -->
      <section id="view-plan" class="view" aria-label="Spojení" hidden>
        <div class="page root">
          <header class="nav-bar">
            <button id="pl-back" class="nav-back" type="button" hidden>
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              <span id="pl-back-label">Zpět</span>
            </button>
            <h1 id="pl-title" class="nav-title">Spojení</h1>
            <span></span>
          </header>
          <div id="pl-body" class="page-body"></div>
        </div>
      </section>
    </main>

    <!-- Filtr -->
    <div id="filter-sheet" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel glass" role="dialog" aria-label="Filtr vozidel">
        <div class="sheet-grip"></div>
        <div class="modal-head">
          <button id="filter-reset" class="text-btn" type="button">Vymazat</button>
          <h2>Filtr</h2>
          <button class="text-btn bold" type="button" data-close>Hotovo</button>
        </div>
        <div class="filter-section">
          <div class="filter-label">Typ</div>
          <div class="segmented" id="filter-type">
            <button type="button" data-type="all">Vše</button>
            <button type="button" data-type="trolleybus">Trolejbusy</button>
            <button type="button" data-type="bus">Autobusy</button>
            <button type="button" data-type="train">Vlaky</button>
          </div>
        </div>
        <div class="filter-section" id="filter-trains">
          <div class="filter-label">Druh vlaku · nic nevybráno = všechny</div>
          <div id="filter-kinds" class="chip-row"></div>
          <div class="filter-label">Dopravce</div>
          <div id="filter-operators" class="chip-row"></div>
        </div>
        <div class="filter-section">
          <div class="filter-label">Linky · nic nevybráno = všechny</div>
          <div id="filter-lines" class="line-grid"></div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast glass" role="status" hidden></div>
    <div id="offline" class="offline" hidden>Bez připojení: polohy vozů se neaktualizují</div>
    <div id="install" class="install glass" hidden>
      <img class="install-icon" src="./icons/icon-192.png" alt="" />
      <span>Přidat IDZK live na plochu</span>
      <button id="install-btn" class="btn primary small" type="button">Instalovat</button>
      <button id="install-close" class="icon-btn" type="button" aria-label="Zavřít">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <nav class="tabbar glass" aria-label="Sekce">
      <button class="tab active" type="button" data-view="map" aria-label="Mapa">
        <svg class="icon-outline" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3 6.2v14l6-2.2 6 2.2 6-2.2v-14L15 6.2 9 4z"/><path d="M9 4v14M15 6.2v14"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8.2 3.3v14.3L3.7 19.3A.5.5 0 0 1 3 18.8V6.6c0-.3.2-.6.5-.7L8.2 3.3zm1.6.1 4.4 1.9v14.3l-4.4-1.9V3.4zm6 1.9 4.5-1.7c.3-.1.7.1.7.5v12.2c0 .3-.2.6-.5.7l-4.7 1.9V5.3z"/></svg>
        <span>Mapa</span>
      </button>
      <button class="tab" type="button" data-view="plan" aria-label="Spojení">
        <svg class="icon-outline" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M6 7.2v3.3a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v.3"/></svg>
        <svg class="icon-filled" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2" fill="currentColor"/><circle cx="18" cy="19" r="2" fill="currentColor"/><path d="M6 7.2v3.3a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v.3"/></svg>
        <span>Spojení</span>
      </button>
    </nav>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
