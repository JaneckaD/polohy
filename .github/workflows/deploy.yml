name: Nasazení na GitHub Pages

on:
  push:
  workflow_dispatch:
  # Jednou týdně obnovíme trasy linek z OpenStreetMap.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run routes
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Koleje oblasti z dat Geofabriku (Overpass bývá přetížený); obnovují se jednou týdně.
      - uses: actions/cache@v4
        with:
          path: railcache
          key: rails-${{ steps.week.outputs.week }}-${{ hashFiles('public/region.json') }}-v1
      - name: Koleje z dat OpenStreetMap
        run: scripts/rails-pbf.sh
        continue-on-error: true
      - run: npm run rails
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Silnice okolí kraje pro vlastní OSRM (trasy linek); obnovují se jednou týdně.
      - uses: actions/cache@v4
        with:
          path: osrm
          key: osrm-${{ steps.week.outputs.week }}-v1
      - name: Vlastní OSRM
        run: scripts/osrm-local.sh
        continue-on-error: true
      - name: pdftotext (písmena spojů DSZO z PDF jízdních řádů)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
        continue-on-error: true
      - run: npm run timetables
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: npm run regiojet
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: npm run build
        env:
          VITE_DSZO_PROXY: ${{ vars.DSZO_PROXY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Nasazuje se jen z výchozí větve repozitáře.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
