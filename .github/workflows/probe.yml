name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          H='-H X-Lang:cs -H X-Currency:CZK'
          echo "== route simple full"
          curl -s -m 20 $H "https://brn-ybus-pubapi.sa.cz/restapi/routes/8729095225/simple?fromStationId=17655001&toStationId=10204002" | python3 -c "
          import json,sys; d=json.load(sys.stdin); d.pop('priceClasses',None); print(json.dumps(d,ensure_ascii=False)[:3000])"
          mkdir pw && cd pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'J'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage();
          p.on('response', async r => { if (/sa\.cz/.test(r.url())) { let s=''; try { s = (await r.text()).slice(0,2500); } catch {} console.log('RES', r.request().method(), r.status(), r.url().slice(0,250), '\n', s); } });
          for (const u of ['https://regiojet.cz/stations/17655001', 'https://regiojet.cz/stations/17902002']) {
            console.log('=== OPEN', u);
            await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
            await p.waitForTimeout(5000);
            const txt = await p.locator('body').innerText().catch(() => '');
            console.log('TEXT', txt.slice(0, 2500).replace(/\n+/g, ' | '));
          }
          await b.close();
          J
          node s.mjs
