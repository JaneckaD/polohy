name: Probe MHD vehicles
on:
  push:
    paths: ['.github/workflows/probe.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          for i in 1 2 3 4; do
            code=$(curl -s -m 30 'https://dszo-proxy.djanecka6.workers.dev/trains' -o trains.json -w "%{http_code}")
            echo "trains $code $(wc -c < trains.json)"; [ "$code" = 200 ] && break; sleep 10
          done
          [ "$code" = 200 ] || { head -c 300 trains.json; curl -s -m 30 -o sz.json -w "SZ direct %{http_code} %{size_download}\n" -H 'Referer: https://mapy.spravazeleznic.cz/vlaky' 'https://mapy.spravazeleznic.cz/serverside/request2.php?module=Layers%5COsVlaky&&action=load'; }
          curl -s -m 60 'https://janeckad.github.io/polohy/tt/planner.json' -o planner.json -w "planner %{http_code}\n"
          curl -s -m 60 'https://janeckad.github.io/polohy/rails.json' -o rails.json -w "rails %{http_code}\n"
          node .github/probe/rails.mjs rails.json
