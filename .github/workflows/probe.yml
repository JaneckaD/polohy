name: Probe proxy trains
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 30 -H 'Origin: https://janeckad.github.io' -D h.txt 'https://dszo-proxy.djanecka6.workers.dev/trains' -o t.json -w "%{http_code} %{size_download}\n"
          cat h.txt
          head -c 1200 t.json; echo
          python3 -c "
          import json,collections
          t=json.load(open('t.json'))['trains']
          print('count',len(t))
          print(collections.Counter(x.get('tt') for x in t).most_common())
          print(collections.Counter(x.get('d') for x in t).most_common())
          for x in t: print(x.get('tt'),x.get('tn'),x.get('fn'),'->',x.get('ln'),'|',x.get('cna'),'| de',x.get('de'),'| a',x.get('a'),'|',x.get('x'),x.get('y'))
          "
          echo "=== vehicles"
          curl -s -m 30 'https://dszo-proxy.djanecka6.workers.dev/' -o v.txt -w "%{http_code} %{size_download}\n"; head -c 300 v.txt; echo
