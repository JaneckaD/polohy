name: Probe CZPTT
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          set +e
          B=https://portal.cisjr.cz/pub/draha/celostatni/szdc
          pip install -q pypdf
          curl -s -m 60 "$B/Popis%20datov%C3%A9%20komunikace%20IS%20KADR%20Dopln%C4%9Bk%20%C4%8D%C3%ADseln%C3%ADky_v1_04.pdf" -o c.pdf
          python3 - <<'PY'
          from pypdf import PdfReader
          t='\n'.join((p.extract_text() or '') for p in PdfReader('c.pdf').pages)
          L=t.split('\n')
          i=[k for k,l in enumerate(L) if '2.16 Centrální poznámky' in l][-1]
          print('\n'.join(l for l in L[i:i+190] if l.strip() and 'Popis datové' not in l and 'Klasifikace' not in l and 'TAF TSI' not in l))
          PY
