name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          mkdir /tmp/j; cd /tmp/j
          curl -s -m 20 'https://mapa.idsjmk.cz/' -H 'User-Agent: Mozilla/5.0' -o index.html
          head -c 3000 index.html; echo
          for u in $(grep -oE '(src|href)="[^"]+\.js[^"]*"' index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            case $u in http*) url=$u;; /*) url="https://mapa.idsjmk.cz$u";; *) url="https://mapa.idsjmk.cz/$u";; esac
            echo "=== $url"; curl -s -m 20 "$url" -o b.js; wc -c b.js
            grep -oE '.{150}(api/|Authorization|apikey|apiKey|X-Api|token|vehicles)[^;]{0,200}' b.js | head -25
          done
