name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          cd /tmp
          for u in https://portal.cisjr.cz/pub/jdf/ https://portal.cisjr.cz/pub/jdf/JDF.zip https://portal.cisjr.cz/pub/ https://portal.cisjr.cz/pub/jdf/celostatni/ \
            https://hoermalmeister.github.io/gtfs-rehost/ https://hoermalmeister.github.io/gtfs-rehost/czbus/ https://hoermalmeister.github.io/gtfs-rehost/czbus/jdf.zip \
            https://github.com/hoermalmeister/gtfs-rehost ; do
            echo "=== $u"; curl -sIL -m 30 "$u" | grep -iE '^(HTTP|content-length|content-type|location)'
          done
          curl -sL -m 30 https://portal.cisjr.cz/pub/jdf/ | head -c 2000; echo
          curl -sL -m 30 https://github.com/hoermalmeister/gtfs-rehost | grep -oE 'gtfs-rehost/tree/main/[a-zA-Z0-9_-]+' | sort -u
