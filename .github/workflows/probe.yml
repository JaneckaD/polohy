name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --silent
      - run: |
          echo "== SZ direct"; curl -s -o /tmp/sz.json -w "%{http_code} %{time_total} %{size_download}\n" -H 'Referer: https://mapy.spravazeleznic.cz/vlaky' 'https://mapy.spravazeleznic.cz/serverside/request2.php?module=Layers%5COsVlaky&&action=load'; head -c 300 /tmp/sz.json; echo
          echo "== mpvnet trains"; curl -s -X POST -H 'Content-Type: application/json' -H 'Origin: https://mpvnet.cz' -H 'Referer: https://mpvnet.cz/zlin/map' -d '{"w":17.1,"s":48.86,"e":18.4,"n":49.54,"zoom":13,"showStops":false,"mapFilterId":null}' https://mpvnet.cz/zlin/map/mapData | python3 -c "
          import json,sys
          d=json.load(sys.stdin); t=[v for v in d.get('transmitters',[]) if v.get('cat')==1]
          print(len(t)); [print(json.dumps(v,ensure_ascii=False)) for v in t[:8]]"
          echo "== DSZO JDF lines"
          node -e "
          import('fflate').then(async ({unzipSync})=>{
            const h=await (await fetch('https://www.dszo.cz/cestujici/jizdni-rady/')).text();
            const m=[...h.matchAll(/[\"'(]([^\"'()\s]*\/jr\/dszo_jr_[\d-]+\.zip[^\"'()\s]*)/g)].map(x=>new URL(x[1],'https://www.dszo.cz/cestujici/jizdni-rady/').href);
            console.log(m[0]);
            let files=unzipSync(new Uint8Array(await (await fetch(m[0])).arrayBuffer()));
            for (const [n,d] of Object.entries(files)) if (n.toLowerCase().endsWith('.zip')) for (const [i,c] of Object.entries(unzipSync(d))) files[n+'/'+i]=c;
            const dec=new TextDecoder('windows-1250');
            for (const [n,d] of Object.entries(files)) if (/linky\.txt$/i.test(n)) console.log(n, dec.decode(d).split('\n').map(l=>l.split(',').slice(0,3).join(',')).join(' | ').slice(0,1500));
          })"
          echo "== GTFS route names with letters"
          curl -sL https://hoermalmeister.github.io/gtfs-rehost/idzk/id-zk-all.zip -o /tmp/g.zip; unzip -o -q /tmp/g.zip routes.txt -d /tmp/g; python3 -c "
          import csv,re
          for r in csv.DictReader(open('/tmp/g/routes.txt',encoding='utf-8-sig')):
            if re.search(r'\d[a-zA-Z]\b', r['route_short_name']+' '+r['route_long_name']): print(r['route_id'],r['route_short_name'],r['route_long_name'])" | head -30
