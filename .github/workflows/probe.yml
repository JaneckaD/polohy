name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          curl -s -m 30 -X POST 'https://mpvnet.cz/zlin/map/mapData' -H 'Origin: https://mpvnet.cz' -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"w":16.9,"s":48.8,"e":18.6,"n":49.7,"zoom":13,"showStops":false,"mapFilterId":null}' -o m.json
          curl -s -m 300 https://portal.cisjr.cz/pub/jdf/JDF.zip -o j.zip
          python3 - <<'PY'
          import json,collections,zipfile,io
          d=json.load(open('m.json')); tr=d['transmitters']
          print('mpvnet n', len(tr))
          c=collections.Counter()
          for t in tr:
            f=str(t.get('cn','')).split('|')
            c[(t['cat'], f[0][:3], t.get('cr'))]+=1
          for k,v in sorted(c.items(), key=str): print(k, v)
          for t in tr:
            f=str(t.get('cn','')).split('|')
            if t['cat']==2 and f[1:2] and f[1].isdigit() and int(f[1])<100: print('LOWLINE', json.dumps(t,ensure_ascii=False)[:300])
          Z=zipfile.ZipFile('j.zip')
          found={}; carriers={}
          for n in Z.namelist():
            try: inner=zipfile.ZipFile(io.BytesIO(Z.read(n)))
            except Exception: continue
            def rd(f):
              try: return inner.read(f).decode('cp1250')
              except KeyError: return ''
            for line in rd('Dopravci.txt').splitlines():
              f=[x.strip('"') for x in line.rstrip(';').split('","')]
              if len(f)>2: carriers.setdefault(f[0], f[2])
            for line in rd('Linky.txt').splitlines():
              f=[x.strip('"') for x in line.rstrip(';').split('","')]
              if not f or not f[0]: continue
              name=f[1] if len(f)>1 else ''
              if any(s in name for s in ('Kroměříž','Uherské Hradiště','Vsetín','Staré Město','Kunovice')) and (len(f)>3 and f[3]=='A' or 'MHD' in name or 'městsk' in name.lower()):
                found[(f[0], name)]=(f, n)
          for (lic,name),(f,n) in sorted(found.items()):
            print('JDF', lic, '|', name, '|', carriers.get(f[2], f[2]), '|', f[3:8], '|', n)
          PY
