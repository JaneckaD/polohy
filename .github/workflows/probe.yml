name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          cd /tmp
          tok=$(curl -s -m 20 'https://mapa.idsjmk.cz/' -H 'User-Agent: Mozilla/5.0' | grep -oE "initializeApplication\('[^']+'" | cut -d"'" -f2)
          echo "token $tok"; echo "$tok" | base64 -d; echo
          curl -s -m 20 'https://mapa.idsjmk.cz/api/vehicles' -H "X-Access-Token: $tok" -H 'User-Agent: Mozilla/5.0' -o v.json
          head -c 600 v.json; echo
          jq '.Vehicles | length' v.json
          jq -c '.Vehicles[0]' v.json
          jq -c '[.Vehicles[] | .VType] | group_by(.) | map({k: .[0], n: length})' v.json
          jq -c '[.Vehicles[] | .LineName] | unique' v.json | cut -c1-3000
          jq -c '.Vehicles[] | select((.LineName|test("^(S|R|Os|Sp)"))) ' v.json | head -12
          jq -c '[.Vehicles[] | keys] | add | unique' v.json
          sid=$(jq -r '[.Vehicles[] | select(.LineName|test("^S"))][0] | "serviceid=\(.ServiceID // .ServiceId)&lineid=\(.LineID)&routeid=\(.RouteID)"' v.json)
          echo "=== serviceinfo $sid"
          curl -s -m 20 "https://mapa.idsjmk.cz/api/serviceinfo?$sid" -H "X-Access-Token: $tok" | head -c 2500; echo
          curl -s -m 20 'https://mapa.idsjmk.cz/api/evidence' -H "X-Access-Token: $tok" | head -c 800; echo
