name: Probe CZPTT
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          B=https://portal.cisjr.cz/pub/draha/celostatni/szdc/
          curl -s -m 30 "$B" | sed 's/<[^>]*>/ /g' | grep -v '^\s*$' | head -30
          curl -s -m 30 "${B}2026/" -o l.html -w "list %{http_code}\n"
          sed 's/<[^>]*>/ /g' l.html | grep -v '^\s*$' | head -60
          f=$(grep -o 'href="[^"]*\.zip"' l.html | sed 's/href="//;s/"//' | head -1)
          echo "FIRST $f"
          small=$(grep -o 'href="[^"]*\.zip"' l.html | sed 's/href="//;s/"//' | tail -1)
          echo "LAST $small"
          curl -s -m 120 -L "${B}2026/$small" -o s.zip -w "zip %{http_code} %{size_download}\n"
          mkdir x && cd x && unzip -q ../s.zip; ls | head; ls | wc -l
          for z in $(ls *.zip 2>/dev/null | head -3); do unzip -q -o "$z"; done
          ls | head
          x=$(ls *.xml | head -1); echo "XML $x"; head -c 4000 "$x"; echo
          echo '--- NSP names/values'
          cat *.xml | grep -o '<Name>[^<]*</Name>\s*<Value>[^<]*</Value>' | sed 's/<[^>]*>/ /g' | sort | uniq -c | sort -rn | head -60
          cat *.xml | tr -d '\r\n' | grep -o '<NetworkSpecificParameter>.\{0,300\}</NetworkSpecificParameter>' | head -20
