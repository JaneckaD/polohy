name: Probe rails
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s -m 60 'https://janeckad.github.io/polohy/rails.json' -o rails.json -w "rails %{http_code}\n"
          gzip -9 -c rails.json | base64 -w 0 > r.b64; echo; echo "B64START"; cat r.b64; echo; echo "B64END"
