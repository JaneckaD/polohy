name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > s.mjs <<'J'
          const K = 'apiKey=7781b8fa-07cf-4ab7-8b62-1f3178523ba0';
          const G = 'https://global.api.flixbus.com/gis';
          const now = Date.now();
          const iso = (t) => new Date(t).toISOString();
          const st = 'dcbc6452-9603-11e6-9066-549f350fcb0c'; // Praha Florenc
          const r = await fetch(`${G}/v2/timetable/${st}/departures?from=${iso(now - 3 * 3600e3)}&to=${iso(now)}&${K}`);
          const t = await r.text(); console.log('TT', r.status, t.slice(0, 2500));
          const rides = JSON.parse(t).rides ?? [];
          let shown = 0;
          for (const x of rides) {
            const id = x.id ?? x.ride_id ?? x.ride?.id ?? x.uuid; if (!id) continue;
            const d = await (await fetch(`${G}/v3/ride/${id}?${K}`)).json();
            if (d.location && shown++ < 2) { const { calls, ...rest } = d; console.log('RIDE', JSON.stringify(rest).slice(0, 2000)); console.log('CALL0', JSON.stringify(calls?.[0]).slice(0, 600)); console.log('CALLS', calls?.length); }
          }
          // stanice v kraji: odjezdy dnes celý den
          for (const s of ['dcc3cb3d-9603-11e6-9066-549f350fcb0c','dcc3d0c6-9603-11e6-9066-549f350fcb0c','ef348d14-f2ed-4ea3-a8f4-0e39bb858ffb','dc20e5be-2dfc-4894-9784-4dea7d942fbe','28d94a3b-cfe4-4dc4-86a5-b3e484cc326c','0dca7499-d85a-41f6-ab4b-7377f25f795f']) {
            for (const kind of ['departures', 'arrivals']) {
              const j = await (await fetch(`${G}/v2/timetable/${s}/${kind}?from=${iso(now - 2 * 3600e3)}&to=${iso(now + 22 * 3600e3)}&${K}`)).json();
              console.log('ST', j.station?.name, kind, (j.rides ?? []).map((x) => `${x.line?.code ?? ''}|${x.id ?? ''}|${JSON.stringify(x).slice(0, 0)}`).join(' '));
            }
          }
          J
          node s.mjs
