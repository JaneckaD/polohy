name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sL 'https://www.dszo.cz/jr/dszo_jr_2026-10-01.zip?foo=20260930' -o /tmp/jr.zip; mkdir -p /tmp/jr; cd /tmp/jr; unzip -o -q /tmp/jr.zip
          echo "== stdin"; pdftotext -layout - - < 08a.pdf | head -5
          echo "== pages"; for f in 08a 38a 02a Na; do pdfinfo $f.pdf | grep Pages; done
          echo "== 08a full"; pdftotext -layout 08a.pdf - | head -400
          echo "== 38a p1-2"; pdftotext -layout -f 1 -l 2 38a.pdf - | head -150
