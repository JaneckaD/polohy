name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build
        env:
          VITE_DSZO_PROXY: ${{ vars.DSZO_PROXY }}
      - run: curl -sfL https://janeckad.github.io/polohy/tt/planner.json -o dist/tt/planner.json --create-dirs && curl -sfL https://janeckad.github.io/polohy/routes-bus.json -o dist/routes-bus.json && curl -sfL https://janeckad.github.io/polohy/routes.json -o dist/routes.json && for f in rails.json rj.json tt/index.json; do curl -sfL https://janeckad.github.io/polohy/$f -o dist/$f; done
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (npx vite preview --port 4173 &) && sleep 3 && node .github/probe/trips.mjs
