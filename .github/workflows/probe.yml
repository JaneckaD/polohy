name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/build-regiojet.mjs
          python3 -c "
          import json; d=json.load(open('public/rj.json')); print('conns',len(d['conns']),'stations',len(d['stations']),'size',len(json.dumps(d)))
          for c in d['conns'][:60]: print(c['id'],c['line'],c['from'],'->',c['to'],c['valid'],c['sym'],c['codes'][:4],[(d['stations'][str(s)][0],a,b) for s,a,b in c['stops']])"
          curl -s -H 'X-Lang: cs' -H 'X-Application-Origin: WEB' https://brn-ybus-pubapi.sa.cz/restapi/consts/timetables/8730625016/symbols | head -c 1500; echo
