name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          set +e
          cd /tmp
          curl -sL -m 300 -o jdf.zip https://portal.cisjr.cz/pub/jdf/JDF.zip; ls -la jdf.zip
          curl -sL -m 120 -o jmk.zip https://kordis-jmk.cz/gtfs/gtfs.zip
          unzip -o -q jmk.zip stops.txt -d jmk
          python3 - <<'P'
          import zipfile, io, csv, re, collections
          z = zipfile.ZipFile('jdf.zip')
          names = z.namelist()
          print('entries', len(names), names[:5])
          def rows(data):
              t = data.decode('cp1250', errors='replace')
              out = []
              for line in t.splitlines():
                  f = re.findall(r'"([^"]*)"', line)
                  if f: out.append(f)
              return out
          # obce IDS JMK podle názvů zastávek („Obec, místo“)
          obce = set()
          for r in csv.DictReader(open('jmk/stops.txt', encoding='utf-8-sig')):
              obce.add(r['stop_name'].split(',')[0].strip().lower())
          print('obci IDS JMK', len(obce))
          lines = []
          def handle(files):
              f = {k.split('/')[-1].lower(): v for k, v in files.items()}
              if 'linky.txt' not in f: return
              L = rows(f['linky.txt']); D = {r[0]: r[2] for r in rows(f.get('dopravci.txt', b''))}
              Z = rows(f.get('zastavky.txt', b''))
              stops = [r[1].strip().lower() for r in Z]
              if 'linky.txt' in f and not handle.shown: print('L sample', rows(f['linky.txt'])[:1]); handle.shown = True
              for l in L:
                  lines.append((l[0], l[1], D.get(l[2], l[2]), l[3], l[4], stops, l))
          handle.shown = False
          sample = True
          for n in names:
              data = z.read(n)
              if n.lower().endswith('.zip'):
                  try:
                      iz = zipfile.ZipFile(io.BytesIO(data))
                      if sample:
                          print('inner', n, iz.namelist()); sample = False
                          for k in iz.namelist():
                              if k.lower().endswith(('linky.txt','dopravci.txt')): print(k, rows(iz.read(k))[:2])
                      handle({k: iz.read(k) for k in iz.namelist()})
                  except Exception as e: print('err', n, e)
          print('linek', len(lines))
          # obce v JMK: jednoznačná větší města (jména obcí se v ČR opakují)
          JMK = {x.lower() for x in ['Brno','Znojmo','Břeclav','Hodonín','Mikulov','Vyškov','Blansko','Boskovice','Kyjov','Hustopeče','Veselí nad Moravou','Ivančice','Tišnov','Slavkov u Brna','Pohořelice','Rousínov','Bučovice','Letovice','Kuřim','Rosice','Moravský Krumlov','Strážnice','Velké Pavlovice','Lanžhot','Židlochovice','Šlapanice','Modřice','Velká nad Veličkou','Bzenec','Dubňany','Valtice','Lednice','Podivín','Hrušovany nad Jevišovkou','Jevišovice','Vranov nad Dyjí','Kunštát','Olešnice','Adamov','Rajhrad','Pasohlávky','Velké Bílovice','Mutěnice','Ratíškovice','Klobouky u Brna','Ždánice','Koryčany']}
          def valid(l):
              ds = [d[4:] + d[2:4] + d[:2] for d in l[5:] if re.fullmatch(r'\d{8}', d) and d[4:6] in ('19','20')]
              return not ds or max(ds) >= '20261012'
          reg = collections.defaultdict(collections.Counter); dal = collections.defaultdict(list)
          seen = set()
          for l in lines:
              no, name, dop, typ, prost, stops, raw = l
              if not valid(raw) or (no, dop) in seen: continue
              seen.add((no, dop))
              inn = {s for s in stops if s in JMK}
              if typ in ('N','P','D'):
                  if inn: dal[dop].append(f'{no} {typ} {name[:70]}')
              elif typ == 'V' and (no.startswith('72') or len(inn) >= 1):
                  reg[dop]['JMK licence' if no.startswith('72') else 'z jineho kraje'] += 1
          print('=== REGIONALNI ===')
          for d, c in sorted(reg.items(), key=lambda x: -sum(x[1].values())): print(f'R {d} | {dict(c)}')
          print('=== DALKOVE ===')
          for d, v in sorted(dal.items(), key=lambda x: -len(x[1])):
              print(f'L {d} | {len(v)} | ' + ' ;; '.join(v[:4]))
          P
