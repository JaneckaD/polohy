name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          curl -sL -m 30 https://wimr-ui.gis.flix.tech/track/assets/index-DglT1Uph.js -o f.js
          echo "=== zl usage"; grep -oE '.{0,150}zl\.[A-Z_]+.{0,250}' f.js | head -20
          echo "=== templates"; grep -oE '`[^`]{0,60}(ride|station|trip|vehicle|position|timetable|departure)[^`]{0,100}`' f.js | sort -u | head -60
          echo "=== quoted paths"; grep -oE '"[^" ]{0,40}/(rides?|stations?|trips?|vehicles?|positions?|timetables?|departures?)[^" ]{0,80}"' f.js | sort -u | head -60
          echo "=== x-api-key"; grep -oE '.{0,200}(X-API-Key|x-api-key|apikey|api_key|X-Api-Key).{0,200}' f.js | head -6
