name: Probe MHD vehicles
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 30 -X POST 'https://mpvnet.cz/zlin/map/mapData' -H 'Origin: https://mpvnet.cz' -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"w":17.1,"s":48.86,"e":18.4,"n":49.54,"zoom":13,"showStops":false,"mapFilterId":null}' -o m.json -w "%{http_code} %{size_download}\n"
          python3 - <<'PY'
          import json,collections
          d=json.load(open('m.json'))
          tr=d['transmitters']
          print('count',len(tr))
          print(collections.Counter((t['cat'],t['cr']) for t in tr).most_common(40))
          def near(t,lat,lon,r): return abs(t['x']-lat)<r and abs(t['y']-lon)<r*1.5
          for name,lat,lon in [('KROMERIZ',49.298,17.393),('VALMEZ',49.472,17.971),('UH',49.07,17.46),('VSETIN',49.339,17.996)]:
            print('=====',name)
            for t in tr:
              if near(t,lat,lon,0.03): print(t['cat'],t['cr'],t['cn'][:150],t['ico'],t['x'],t['y'],t['tm'],t['ds'])
          print(json.dumps(tr[:2],ensure_ascii=False))
          print([k for k in d.keys()])
          PY
