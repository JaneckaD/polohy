name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          abs() { case "$1" in http*) echo "$1";; //*) echo "https:$1";; /*) echo "$2$1";; *) echo "$2/$1";; esac; }
          scan() { # $1 base url, $2 page url, $3 grep pattern
            curl -sL -m 30 -A "$UA" "$2" -o p.html; echo "## $2 $(wc -c < p.html)"; head -c 1500 p.html | tr '\n' ' '; echo
            for js in $(grep -oE '(src|href)="[^"]+\.m?js[^"]*"' p.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u | head -25); do
              u=$(abs "$js" "$1"); curl -sL -m 20 -A "$UA" "$u" -o x.js
              echo "-- $u $(wc -c < x.js)"; grep -oE "$3" x.js | sort -u | head -40
            done
          }
          echo "=== KROMERIZ"
          scan https://kromeriz.mhdonline.cz https://kromeriz.mhdonline.cz/ '"[^"]{0,60}(/api|api\.|https?://|wss?://|\.json|vehicle|Vehicle|position|Position)[^"]{0,100}"'
          for p in manifest.json api/vehicles api/vehicle api/positions vehicles.json data/vehicles.json; do echo "-- $p"; curl -s -m 15 -A "$UA" "https://kromeriz.mhdonline.cz/$p" | head -c 400; echo; done
          echo "=== KMTS"
          curl -sL -m 30 -A "$UA" https://www.kmts.cz/aktuality-mimoradnosti-mhd/mame-pro-vas-novinku-v-online-mape-mhd-kromeriz | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -iE 'map|online|poloh|http' | head -30
          echo "=== FLIXTRACK"
          scan https://www.flixbus.cz https://www.flixbus.cz/track '"[^"]{0,40}(gis|track|ride|position)[^"]{0,120}"'
          echo "=== REGIOJET"
          scan https://regiojet.cz https://regiojet.cz/ '"[^"]{0,40}(position|Position|vehicle|Vehicle|track|gps|Gps)[^"]{0,100}"'
