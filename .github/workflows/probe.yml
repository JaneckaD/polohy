name: Probe train sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          U='https://mapy.spravazeleznic.cz/serverside/request2.php?module=Layers\OsVlaky&&action=load'
          curl -s -m 30 -A "$UA" "$U" -o a.json
          curl -s -m 30 -A "$UA" 'https://mapy.spravazeleznic.cz/serverside/request2.php?module=Layers%5COsVlaky&&action=load' -o c.json -w "encoded url: %{http_code} %{size_download}\n"
          sleep 45
          curl -s -m 30 -A "$UA" "$U" -o b.json
          python3 - <<'PY'
          import json, math, collections
          A={f['id']:f for f in json.load(open('a.json'))['result']}
          B={f['id']:f for f in json.load(open('b.json'))['result']}
          print('cachedResult etc', {k:v for k,v in json.load(open('b.json')).items() if k!='result'})
          rows=[]
          for i,f in B.items():
            if i not in A: continue
            (x1,y1),(x2,y2)=A[i]['geometry']['coordinates'],B[i]['geometry']['coordinates']
            dx,dy=x2-x1,y2-y1
            d=math.hypot(dx,dy)
            if d<150: continue
            # 5514: x east (negative values grow east), y north
            brg=(math.degrees(math.atan2(dx,dy))+360)%360
            rows.append((round(brg),round(float(f['properties']['a'] or -1)),round(float(A[i]['properties']['a'] or -1)),round(d), f['properties']['tt']))
          print('moved',len(rows)); 
          for r in rows[:30]: print(r)
          keys=collections.Counter()
          for f in B.values(): keys.update(f['properties'].keys())
          print(keys)
          for k in ('type','de','s','di','rr','e','r'):
            print(k, collections.Counter(str(f['properties'].get(k)) for f in B.values()).most_common(10))
          print('pde', collections.Counter(f['properties'].get('pde') for f in B.values()).most_common(15))
          zk=[f for f in B.values() if -566400<f['geometry']['coordinates'][0]<-460800 and -1202700<f['geometry']['coordinates'][1]<-1128700]
          print('in bbox', len(zk)); print('a types', collections.Counter(type(f['properties'].get('a')).__name__ for f in B.values()))
          for f in zk: print(json.dumps(f['properties'],ensure_ascii=False))
          PY
