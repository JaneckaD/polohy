name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sL 'https://www.dszo.cz/jr/dszo_jr_2026-10-01.zip?foo=20260930' -o /tmp/jr.zip; mkdir -p /tmp/jr; cd /tmp/jr; unzip -o -q /tmp/jr.zip
          for f in 31a 38a 04a 01a; do for p in 1 3; do echo "=== $f page $p"; pdftotext -layout -f $p -l $p $f.pdf - | sed 's/\xef[\x80-\xbf][\x80-\xbf]/#/g' | head -50 | cut -c1-120; done; done
