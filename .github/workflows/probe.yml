name: Probe CZPTT
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          B=https://portal.cisjr.cz/pub/draha/celostatni/szdc
          curl -sI -m 30 "$B/2026/JR2026.zip" | grep -i 'length\|type'
          curl -s -m 30 "$B/2026/2026-10/" | grep -io 'href="[^"]*"' | head -8
          curl -s -m 300 "$B/2026/JR2026.zip" -o jr.zip -w "zip %{http_code} %{size_download}\n"
          unzip -l jr.zip | head -5; unzip -l jr.zip | tail -2
          mkdir x && cd x && unzip -q ../jr.zip
          n=$(find . -name '*.zip' | wc -l); echo "inner zips $n"
          if [ "$n" -gt 0 ]; then find . -name '*.zip' | head -3000 | xargs -n1 unzip -q -o 2>/dev/null; fi
          find . -name '*.xml' | wc -l
          grep -l 'Otrokovice' $(find . -name '*.xml' | head -20000) 2>/dev/null | head -400 > zl.txt; wc -l zl.txt
          x=$(head -1 zl.txt); echo "XML $x"; head -c 6000 "$x"; echo
          echo '--- NSP'
          cat $(cat zl.txt) | tr -d '\r\n' | grep -o '<NetworkSpecificParameter>.\{0,200\}</NetworkSpecificParameter>' | sed 's/\s\+/ /g' | sort | uniq -c | sort -rn | head -80
          echo '--- TrainActivity'
          cat $(cat zl.txt) | grep -o '<TrainActivityType>[^<]*' | sort | uniq -c | sort -rn | head -30
          cd ..
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -s -m 60 "$B/Popis%20datov%C3%A9%20komunikace%20IS%20KADR%20Dopln%C4%9Bk%20%C4%8D%C3%ADseln%C3%ADky_v1_04.pdf" -o c.pdf -w "pdf %{http_code} %{size_download}\n"
          pdftotext -layout c.pdf c.txt; grep -n -i -B2 -A60 'CentralPTTNote\|Poznámk' c.txt | head -250
