name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          curl -s -H 'X-Lang: cs' https://brn-ybus-pubapi.sa.cz/restapi/consts/locations | python3 -c "
          import json,sys
          d=json.load(sys.stdin); c=d[0]['cities'][0]; print(json.dumps(c,ensure_ascii=False)[:800])
          for co in d:
            for c in co['cities']:
              if c['name'] in ('Olomouc','Ostrava','Přerov','Karviná','Frýdek-Místek'): print(c['id'], c['name'])"
          node scripts/build-regiojet.mjs
          python3 -c "
          import json; d=json.load(open('public/rj.json')); print('conns',len(d['conns']),'stations',len(d['stations']),'size',len(json.dumps(d)))
          for c in d['conns'][:40]: print(c['id'],c['line'],c['from'],'->',c['to'],c['sym'],c['codes'][:3],[(d['stations'][str(s)][0],a,b) for s,a,b in c['stops']])"
          D=$(date -u +%Y-%m-%d)
          for p in "17653000 10202002" "10202002 17653000"; do set -- $p
            curl -s -H 'X-Lang: cs' -H 'X-Currency: CZK' "https://brn-ybus-pubapi.sa.cz/restapi/routes/search/simple?tariffs=REGULAR&toLocationType=CITY&toLocationId=$2&fromLocationType=CITY&fromLocationId=$1&departureDate=$D" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin).get('routes',[]): print(r['id'], r['departureTime'], r.get('predictedDepartureTime'), r['arrivalTime'], r.get('predictedArrivalTime'), r.get('delay'))"
          done
