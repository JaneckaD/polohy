name: Probe MHD
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          B=https://wimr-ui.gis.flix.tech/track/assets
          curl -sL -m 30 $B/index-DglT1Uph.js -o f.js
          for c in $(grep -oE '"\./[A-Za-z0-9_-]+\.js"' f.js | tr -d '"' | sort -u | grep -v -E '^\./[a-z]{2}(_[A-Z]{2})?-' ); do
            curl -sL -m 20 "$B/${c#./}" -o c.js
            if grep -qE 'WIMB|WIMR_API_KEY|/gis' c.js; then echo "-- $c $(wc -c < c.js)"; grep -oE '.{0,250}(WIMB_API_URL|WIMR_API_KEY).{0,350}' c.js | head -12; fi
          done
